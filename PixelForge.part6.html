<script>
// Graphics tablet / stylus support for PixelForge 3.7
(() => {
  const tablet = {
    pointerType: 'mouse',
    pressure: 1,
    tiltX: 0,
    tiltY: 0,
    twist: 0,
    width: 1,
    height: 1,
    eraserActive: false,
    previousTool: null,
    detected: false,
    settings: {
      pressureSize: true,
      pressureOpacity: true,
      tiltSize: false,
      minSize: 12,
      minOpacity: 18,
      curve: 1.0
    }
  };

  try {
    const saved = JSON.parse(localStorage.getItem('pixelforge_tablet_settings') || '{}');
    tablet.settings = {...tablet.settings, ...saved};
  } catch(e) {}

  function saveTabletSettings(){
    try { localStorage.setItem('pixelforge_tablet_settings', JSON.stringify(tablet.settings)); } catch(e) {}
  }

  function clamp(v,a,b){ return Math.max(a, Math.min(b, v)); }
  function normalizedPressure(){
    if(tablet.pointerType !== 'pen') return 1;
    const raw = clamp(Number.isFinite(tablet.pressure) ? tablet.pressure : 0.5, 0, 1);
    return Math.pow(raw, clamp(+tablet.settings.curve || 1, 0.25, 3));
  }
  function pressureWidth(base){
    if(tablet.pointerType !== 'pen' || !tablet.settings.pressureSize) return base;
    const p = normalizedPressure();
    const min = clamp((+tablet.settings.minSize || 12) / 100, 0.01, 1);
    let w = base * (min + (1-min)*p);
    if(tablet.settings.tiltSize){
      const tilt = clamp(Math.hypot(tablet.tiltX || 0, tablet.tiltY || 0) / 90, 0, 1);
      w *= 1 + tilt * 0.35;
    }
    return Math.max(0.5, w);
  }
  function pressureAlpha(){
    if(tablet.pointerType !== 'pen' || !tablet.settings.pressureOpacity) return 1;
    const p = normalizedPressure();
    const min = clamp((+tablet.settings.minOpacity || 18) / 100, 0.01, 1);
    return min + (1-min)*p;
  }

  function updateFromPointer(e){
    tablet.pointerType = e.pointerType || 'mouse';
    if(tablet.pointerType === 'pen') tablet.detected = true;
    tablet.pressure = tablet.pointerType === 'pen' ? clamp(e.pressure || 0, 0, 1) : 1;
    tablet.tiltX = e.tiltX || 0;
    tablet.tiltY = e.tiltY || 0;
    tablet.twist = e.twist || 0;
    tablet.width = e.width || 1;
    tablet.height = e.height || 1;
    renderTabletStatus();
  }

  const oldPaintLine = paintLine;
  paintLine = function(x1,y1,x2,y2){
    if(tablet.pointerType !== 'pen') return oldPaintLine(x1,y1,x2,y2);
    ctx.save();
    ctx.lineCap='round';
    ctx.lineJoin='round';
    const base=+document.getElementById('size').value;
    ctx.lineWidth=pressureWidth(base);
    ctx.globalAlpha=pressureAlpha();
    ctx.strokeStyle=document.getElementById('color').value;
    if(tool==='eraser'){
      ctx.globalCompositeOperation='destination-out';
      ctx.globalAlpha=Math.max(0.12, pressureAlpha());
      ctx.strokeStyle='rgba(0,0,0,1)';
    }
    ctx.beginPath();
    ctx.moveTo(x1,y1);
    ctx.lineTo(x2,y2);
    ctx.stroke();
    ctx.restore();
  };

  const panel=document.createElement('div');
  panel.className='panel';
  panel.id='tabletPanel';
  panel.innerHTML=`
    <h3>Графический планшет</h3>
    <div id="tabletStatus" class="small">Перо не обнаружено · мышь работает как обычно</div>
    <label style="display:flex;gap:8px;align-items:center"><input id="tabletPressureSize" type="checkbox" style="width:auto"> Нажим меняет размер кисти</label>
    <label style="display:flex;gap:8px;align-items:center"><input id="tabletPressureOpacity" type="checkbox" style="width:auto"> Нажим меняет прозрачность</label>
    <label style="display:flex;gap:8px;align-items:center"><input id="tabletTiltSize" type="checkbox" style="width:auto"> Наклон немного увеличивает ширину</label>
    <label>Минимальный размер <span id="tabletMinSizeVal"></span></label>
    <input id="tabletMinSize" type="range" min="1" max="100" value="12">
    <label>Минимальная непрозрачность <span id="tabletMinOpacityVal"></span></label>
    <input id="tabletMinOpacity" type="range" min="1" max="100" value="18">
    <label>Кривая нажима <span id="tabletCurveVal"></span></label>
    <input id="tabletCurve" type="range" min="25" max="300" value="100">
    <div class="small" style="margin-top:8px">Обратный конец совместимого стилуса автоматически работает как ластик. Поддержка использует стандартные события Windows/Electron, поэтому отдельный модуль для Wacom, Huion или XP-Pen не требуется.</div>`;
  const right=document.querySelector('.right');
  if(right) right.insertBefore(panel, right.firstChild);

  const el=id=>document.getElementById(id);
  function syncControls(){
    if(!el('tabletPressureSize')) return;
    el('tabletPressureSize').checked=!!tablet.settings.pressureSize;
    el('tabletPressureOpacity').checked=!!tablet.settings.pressureOpacity;
    el('tabletTiltSize').checked=!!tablet.settings.tiltSize;
    el('tabletMinSize').value=tablet.settings.minSize;
    el('tabletMinOpacity').value=tablet.settings.minOpacity;
    el('tabletCurve').value=Math.round((+tablet.settings.curve||1)*100);
    el('tabletMinSizeVal').textContent=tablet.settings.minSize+'%';
    el('tabletMinOpacityVal').textContent=tablet.settings.minOpacity+'%';
    el('tabletCurveVal').textContent=(+tablet.settings.curve||1).toFixed(2);
  }
  function bindSetting(id,key,parser){
    const node=el(id); if(!node)return;
    const ev=node.type==='checkbox'?'change':'input';
    node.addEventListener(ev,()=>{
      tablet.settings[key]=node.type==='checkbox'?node.checked:parser(node.value);
      saveTabletSettings(); syncControls();
    });
  }
  bindSetting('tabletPressureSize','pressureSize',Boolean);
  bindSetting('tabletPressureOpacity','pressureOpacity',Boolean);
  bindSetting('tabletTiltSize','tiltSize',Boolean);
  bindSetting('tabletMinSize','minSize',v=>+v);
  bindSetting('tabletMinOpacity','minOpacity',v=>+v);
  bindSetting('tabletCurve','curve',v=>+v/100);

  function renderTabletStatus(){
    const s=el('tabletStatus'); if(!s)return;
    if(tablet.pointerType==='pen'){
      const p=Math.round((tablet.pressure||0)*100);
      const tilt=Math.round(Math.hypot(tablet.tiltX||0,tablet.tiltY||0));
      s.textContent=`Перо обнаружено · нажим ${p}% · наклон ${tilt}°${tablet.eraserActive?' · ластик':''}`;
    } else if(tablet.detected){
      s.textContent='Планшет подключался · сейчас используется мышь';
    } else {
      s.textContent='Перо не обнаружено · мышь работает как обычно';
    }
  }

  canvas.addEventListener('pointerover', updateFromPointer, true);
  canvas.addEventListener('pointermove', updateFromPointer, true);
  canvas.addEventListener('pointerdown', e=>{
    updateFromPointer(e);
    if(e.pointerType==='pen' && (e.button===5 || (e.buttons & 32))){
      tablet.eraserActive=true;
      tablet.previousTool=tool;
      setTool('eraser');
      renderTabletStatus();
    }
  }, true);
  canvas.addEventListener('pointerup', e=>{
    updateFromPointer(e);
    if(tablet.eraserActive){
      tablet.eraserActive=false;
      const restore=tablet.previousTool;
      tablet.previousTool=null;
      if(restore && restore!=='eraser') setTool(restore);
      renderTabletStatus();
    }
  });
  canvas.addEventListener('pointercancel', ()=>{
    if(tablet.eraserActive){
      tablet.eraserActive=false;
      const restore=tablet.previousTool;
      tablet.previousTool=null;
      if(restore && restore!=='eraser') setTool(restore);
    }
    renderTabletStatus();
  });

  canvas.addEventListener('pointermove', e=>{
    if(e.pointerType!=='pen' || !cursorEl) return;
    const base=+document.getElementById('size').value;
    const visual=Math.max(2, pressureWidth(base));
    cursorEl.style.width=visual+'px';
    cursorEl.style.height=visual+'px';
    cursorEl.style.opacity=String(clamp(0.45+pressureAlpha()*0.55,0.45,1));
  });

  canvas.addEventListener('pointerleave', ()=>{ if(cursorEl) cursorEl.style.opacity='1'; });
  canvas.addEventListener('contextmenu', e=>{ if(tablet.pointerType==='pen') e.preventDefault(); });

  syncControls();
  renderTabletStatus();
})();
</script>
