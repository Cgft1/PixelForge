<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PixelForge — графический редактор</title>
<style>
:root{--bg:#202124;--panel:#2b2d31;--panel2:#35373c;--line:#45484e;--text:#eee;--muted:#aeb2ba;--accent:#4d8dff}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px Segoe UI,Arial,sans-serif;overflow:hidden}
button,input,select{font:inherit}button{background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:5px;padding:7px 10px;cursor:pointer}button:hover{background:#484b52}button.active{background:#315d9e;border-color:#619cff}
.top{height:43px;display:flex;align-items:center;gap:8px;padding:0 12px;background:#292a2d;border-bottom:1px solid var(--line)}
.brand{font-weight:700;font-size:16px;margin-right:14px}.brand b{color:#6ea5ff}.menu{color:#ddd;padding:6px 8px;cursor:pointer}.menu:hover{background:#3b3d42;border-radius:4px}
.toolbar{height:48px;background:var(--panel);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:9px;padding:5px 12px;flex-wrap:wrap}
.layout{display:grid;grid-template-columns:52px 1fr 270px;height:calc(100vh - 91px)}
.left{background:var(--panel);border-right:1px solid var(--line);padding:7px 5px;display:flex;flex-direction:column;gap:5px;align-items:center}
.tool{width:39px;height:38px;padding:0;font-size:18px}.workspace{position:relative;overflow:auto;background:#18191b;display:flex;align-items:center;justify-content:center;padding:28px}
.canvasWrap{position:relative;box-shadow:0 6px 28px #0008;background:transparent;max-width:none;max-height:none;transform-origin:center center;will-change:transform}canvas{display:block;max-width:none;max-height:none;touch-action:none}#displayCanvas{background-color:#fff;background-image:linear-gradient(45deg,#ddd 25%,transparent 25%),linear-gradient(-45deg,#ddd 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#ddd 75%),linear-gradient(-45deg,transparent 75%,#ddd 75%);background-size:20px 20px;background-position:0 0,0 10px,10px -10px,-10px 0;position:relative}#canvas{position:absolute;left:0;top:0;opacity:1;pointer-events:auto;background:transparent}#brushCursor{position:absolute;left:0;top:0;width:12px;height:12px;border:1px solid #fff;border-radius:50%;box-shadow:0 0 0 1px #111;pointer-events:none;z-index:20;transform:translate(-50%,-50%);display:none}
.right{background:var(--panel);border-left:1px solid var(--line);overflow:auto;padding:12px}
.panel{background:#303237;border:1px solid var(--line);border-radius:7px;margin-bottom:12px;padding:11px}
h3{font-size:13px;margin:0 0 11px;color:#f0f1f3}label{display:block;color:var(--muted);font-size:12px;margin:9px 0 5px}
input[type=range]{width:100%;accent-color:var(--accent)}input[type=color]{width:100%;height:32px;background:transparent;border:0;padding:0}input[type=text],input[type=number],select{width:100%;background:#222428;color:var(--text);border:1px solid var(--line);border-radius:4px;padding:7px}
.row{display:flex;gap:7px;align-items:center}.row>*{flex:1}.small{font-size:12px;color:var(--muted)}.layer{padding:9px;background:#3c3f45;border-radius:5px;margin-top:7px;display:flex;justify-content:space-between;align-items:center}
.status{position:absolute;bottom:0;left:0;right:0;background:#242529;border-top:1px solid var(--line);height:25px;display:flex;align-items:center;justify-content:space-between;padding:0 12px;color:var(--muted);font-size:12px}
#emptyHint{position:absolute;color:#666;pointer-events:none;text-align:center;line-height:1.7}
.hidden{display:none!important}
@media(max-width:800px){.layout{grid-template-columns:46px 1fr}.right{display:none}.toolbar{height:auto;min-height:48px}.layout{height:calc(100vh - 110px)}}
.pf-tabs{display:flex;gap:4px;flex-wrap:wrap}.pf-tabs button{font-size:12px;padding:7px 9px}.pf-tabs button.selected{background:#3d5a96;color:#fff}.pf-modal{position:fixed;inset:0;z-index:1000;background:#0009;display:flex;align-items:center;justify-content:center}.pf-modal.hidden{display:none}.pf-dialog{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:20px;max-width:560px;width:min(92vw,560px);max-height:80vh;overflow:auto;box-shadow:0 18px 60px #0008}.pf-dialog h2{margin-top:0}.shortcut-row{display:grid;grid-template-columns:1fr auto auto;gap:8px;align-items:center;padding:7px 0;border-bottom:1px solid var(--line)}.shortcut-row button{min-width:80px}.pf-panel-hidden{display:none!important}@media(max-width:900px){.pf-tabs{order:10;width:100%}}
</style>
</head>
<body>
<div class="top">
 <div class="brand"><b>PF</b> PixelForge</div>
 <div class="menu" id="newBtn">Файл</div><div class="menu" id="editMenu">Правка</div><div class="menu" id="imageMenu">Изображение</div><div class="menu" id="filterMenu">Фильтры</div><div class="menu" id="helpBtn">Справка</div>
 <div style="flex:1"></div><span class="small">Графический редактор</span>
</div>
<div class="toolbar">
 <div class="pf-tabs" id="pfTabs"><button data-tab="drawing" class="selected">Рисование</button><button data-tab="selection">Выделение</button><button data-tab="color">Цветокоррекция</button><button data-tab="filters">Фильтры</button><button data-tab="text">Текст</button></div>
 <button id="keySettingsBtn" title="Настроить клавиши">⌨ Клавиши</button>
 <button id="openBtn">📂 Открыть</button><button id="saveBtn">💾 Экспорт PNG</button><button id="undoBtn">↶ Отменить</button><button id="redoBtn">↷ Повторить</button>
 <span style="width:1px;height:26px;background:var(--line)"></span>
 <label style="margin:0;display:flex;align-items:center;gap:6px">Размер <input id="size" type="range" min="1" max="80" value="12" style="width:90px"></label>
 <label style="margin:0;display:flex;align-items:center;gap:6px">Цвет <input id="color" type="color" value="#202020" style="width:35px"></label>
 <label style="margin:0;display:flex;align-items:center;gap:6px">Масштаб <button id="zoomOut">−</button><span id="zoomLabel">75%</span><button id="zoomIn">＋</button></label><label style="margin:0;display:flex;align-items:center;gap:6px">Поворот <button id="rotateLeft">↶</button><span id="rotateLabel">0°</span><button id="rotateRight">↷</button><button id="resetView">Сброс</button></label>
</div>
<div class="layout">
 <aside class="left">
  <button class="tool active" data-tool="brush" title="Кисть (B)">🖌</button>
  <button class="tool" data-tool="eraser" title="Ластик (E)">🧽</button>
<button class="tool" data-tool="fill" title="Заливка">🪣</button>
  <button class="tool" data-tool="line" title="Линия">╱</button>
  <button class="tool" data-tool="rect" title="Прямоугольник">▱</button>
  <button class="tool" data-tool="circle" title="Эллипс">◯</button>
  <button class="tool" data-tool="text" title="Текст">T</button>
  <button class="tool" data-tool="fill" title="Заливка фона">▰</button>
  <button class="tool" data-tool="picker" title="Пипетка">🎯</button>
