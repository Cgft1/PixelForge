name: Build PortalCraft JAR

on:
  push:
    branches: [portalcraft-build-ci]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'
      - name: Generate resources
        working-directory: portalcraft-ci
        run: python3 generate_resources.py
      - name: Build mod
        working-directory: portalcraft-ci
        run: gradle --no-daemon build --stacktrace
      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: PortalCraft-1.20.1-jar
          path: portalcraft-ci/build/libs/*.jar
          if-no-files-found: error
